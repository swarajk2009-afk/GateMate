name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          ./node_modules/.bin/vite build

      - name: Configure Capacitor and Android platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.loyalmates.gatemate",
            "appName": "GateMate",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          ./node_modules/.bin/cap add android
          ./node_modules/.bin/cap sync android
          MANIFEST=$(find android -name "AndroidManifest.xml" | grep "src/main" | head -n 1)
          echo "Updating manifest: $MANIFEST"
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.CAMERA" \/><\/manifest>/' "$MANIFEST"

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateMate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
