name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build Vite web app
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx vite build

      - name: Ensure capacitor.config.json exists & add Android platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.loyalmates.gatemate",
            "appName": "GateMate",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.CAMERA" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateMate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
